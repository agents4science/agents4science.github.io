<svg viewBox="0 0 900 300" width="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5"/>
      <stop offset="100%" style="stop-color:#a7f3d0"/>
    </linearGradient>
    <linearGradient id="bursarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9d5ff"/>
      <stop offset="100%" style="stop-color:#d8b4fe"/>
    </linearGradient>
    <linearGradient id="facilityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fed7aa"/>
      <stop offset="100%" style="stop-color:#fdba74"/>
    </linearGradient>
    <linearGradient id="bucketGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#ede9fe"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="900" height="300" fill="#fafafa"/>

  <!-- ===== LEFT: agent campaign ===== -->
  <rect x="25" y="60" width="230" height="185" rx="12" fill="url(#agentGrad)" stroke="#6ee7b7"/>
  <text x="140" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#065f46">Agent campaign</text>
  <!-- agent icons -->
  <circle cx="70" cy="115" r="11" fill="#10b981"/>
  <circle cx="105" cy="115" r="11" fill="#10b981"/>
  <circle cx="140" cy="115" r="11" fill="#10b981"/>
  <text x="70" y="119" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">A</text>
  <text x="105" y="119" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">A</text>
  <text x="140" y="119" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">A</text>
  <text x="175" y="119" font-family="sans-serif" font-size="12" fill="#065f46">&#8230;</text>
  <text x="140" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">10&#8310;&#8314; candidate tasks,</text>
  <text x="140" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">generated dynamically</text>
  <rect x="45" y="182" width="190" height="46" rx="6" fill="#ffffff" opacity="0.75"/>
  <text x="140" y="200" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#334155">intent: 64&#8211;1024 GPUs</text>
  <text x="140" y="216" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#334155">deadline 13:30 &#183; 18k credits</text>

  <!-- ===== MIDDLE: Bursar ===== -->
  <rect x="330" y="40" width="240" height="225" rx="12" fill="url(#bursarGrad)" stroke="#c084fc"/>
  <text x="450" y="66" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#581c87">Bursar</text>
  <text x="450" y="83" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b21a8">agent resource broker</text>

  <!-- token bucket -->
  <path d="M 395 105 L 405 165 L 455 165 L 465 105" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="403" y="130" width="54" height="33" fill="url(#bucketGrad)"/>
  <circle cx="418" cy="140" r="5" fill="#8b5cf6"/>
  <circle cx="434" cy="148" r="5" fill="#8b5cf6"/>
  <circle cx="446" cy="138" r="5" fill="#8b5cf6"/>
  <circle cx="424" cy="155" r="5" fill="#8b5cf6"/>
  <!-- refill arrow -->
  <line x1="430" y1="92" x2="430" y2="102" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="482" y="120" font-family="sans-serif" font-size="11" fill="#581c87">tokens in at R,</text>
  <text x="482" y="135" font-family="sans-serif" font-size="11" fill="#581c87">drain by held</text>
  <text x="482" y="150" font-family="sans-serif" font-size="11" fill="#581c87">capacity</text>

  <rect x="350" y="180" width="200" height="70" rx="6" fill="#ffffff" opacity="0.75"/>
  <text x="450" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">budgets &#183; rate + burst envelopes</text>
  <text x="450" y="214" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">service classes &#183; congestion index</text>
  <text x="450" y="230" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">journaled admission &#183; guarantees</text>

  <!-- ===== RIGHT: facility ===== -->
  <rect x="645" y="60" width="230" height="185" rx="12" fill="url(#facilityGrad)" stroke="#fb923c"/>
  <text x="760" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7c2d12">Facility scheduler</text>
  <text x="760" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9a3412">PBS Professional / Slurm</text>
  <!-- GPU grid -->
  <g fill="#fb923c" stroke="#ea580c" stroke-width="0.5">
    <rect x="675" y="118" width="22" height="22" rx="3"/><rect x="703" y="118" width="22" height="22" rx="3"/>
    <rect x="731" y="118" width="22" height="22" rx="3"/><rect x="759" y="118" width="22" height="22" rx="3"/>
    <rect x="787" y="118" width="22" height="22" rx="3"/><rect x="815" y="118" width="22" height="22" rx="3"/>
    <rect x="675" y="146" width="22" height="22" rx="3"/><rect x="703" y="146" width="22" height="22" rx="3"/>
  </g>
  <g fill="#a7f3d0" stroke="#10b981" stroke-width="0.8">
    <rect x="731" y="146" width="22" height="22" rx="3"/><rect x="759" y="146" width="22" height="22" rx="3"/>
    <rect x="787" y="146" width="22" height="22" rx="3"/><rect x="815" y="146" width="22" height="22" rx="3"/>
  </g>
  <text x="760" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7c2d12">green = leased to campaign</text>
  <rect x="665" y="200" width="190" height="30" rx="6" fill="#ffffff" opacity="0.75"/>
  <text x="760" y="219" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">warm pool &#183; reservations &#183; preempt</text>

  <!-- ===== FLOWS ===== -->
  <line x1="255" y1="120" x2="326" y2="120" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="291" y="110" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#065f46">intent</text>
  <line x1="326" y1="175" x2="255" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="291" y="192" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">supply + lease</text>
  <line x1="570" y1="120" x2="641" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="606" y="110" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">allocations</text>
  <line x1="641" y1="175" x2="570" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="606" y="192" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#475569">capacity state</text>

  <!-- caption -->
  <text x="450" y="288" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-style="italic" fill="#64748b">Task creation stays cheap and unlimited; resource consumption is metered, bounded, and auditable.</text>
</svg>
